<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}

/* Layout: one narrow phone column like a Telegram mini app, bottom tab bar; ink-on-paper with a jade accent */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#18211F; --muted:#5E6B67; --line:#DCE2DE;
  --accent:#1E7563; --accent-soft:#DDEDE8; --on-accent:#FFFFFF;
  --known:#2E8B57; --unsure:#D59A1E; --new:#C8463B;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A2220; --ink:#E7EDEA; --muted:#93A29D; --line:#2C3633;
  --accent:#4FB79E; --accent-soft:#1E332D; --on-accent:#0B1412; --known:#4CB77C; --unsure:#E3AE3F; --new:#E2665B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A2220; --ink:#E7EDEA; --muted:#93A29D; --line:#2C3633;
  --accent:#4FB79E; --accent-soft:#1E332D; --on-accent:#0B1412; --known:#4CB77C; --unsure:#E3AE3F; --new:#E2665B; color-scheme:dark}
[hidden]{display:none!important}

body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;

p{margin:0}
.muted{color:var(--muted)}

.wlist{display:flex;flex-direction:column}

.wrow:first-child{border-top:0}

  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:440px;width:100%}
.tab{padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}

.tab.on{color:var(--accent)}
.flip{display:grid;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:22px}
.face{grid-area:1/1;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 18px 22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:380px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s cubic-bezier(.3,.7,.3,1)}
.face.back{transform:rotateY(180deg);gap:12px}
.flip .back{pointer-events:none}
.flip.on .front{transform:rotateY(-180deg);pointer-events:none}
.flip.on .back{transform:rotateY(0) translateZ(1px);pointer-events:auto;z-index:1}
.face .speak{position:relative;z-index:2}
.speak:active{transform:scale(.94)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;z-index:20;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 25%,transparent)}
.front .hz{font-size:clamp(72px,24vw,112px)}
.front .hz.long{font-size:clamp(48px,14vw,72px)}
.tr.big{font-size:30px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg button b{font-family:var(--hz);font-size:18px}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 12%,transparent)}
.hint{font-size:12px;color:var(--muted);margin-top:18px}
.tr{font-size:24px;font-weight:600;line-height:1.25;text-wrap:balance;margin-top:6px}
.wpy{display:flex;align-items:center;gap:10px}
.wpy .py{font-size:22px}
.speak.sm{padding:7px 12px;font-size:14px}
.sent{width:100%;margin-top:8px;padding-top:16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;gap:6px}
.szh{font-family:var(--hz);font-size:24px;line-height:1.4;font-weight:500}
.spy{color:var(--accent);font-size:15px}
.sru{color:var(--muted);font-size:15px;text-wrap:balance;margin-bottom:4px}
.zhs{font-family:var(--hz);font-weight:700}
.zhs.big{font-size:30px}
.rtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg.mini{grid-template-columns:auto auto;padding:3px}

.reader{display:flex;flex-direction:column;gap:4px;padding:8px}
.sent-row{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 8px;border-radius:12px;transition:background .2s}

.szh-r{font-family:var(--hz);font-size:23px;line-height:1.7}

.tk-n{text-decoration-color:color-mix(in srgb,var(--new) 55%,transparent)}

.tk-k{text-decoration-color:color-mix(in srgb,var(--known) 45%,transparent)}
.lg{font-family:var(--hz);text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-line:underline;margin-right:4px;font-style:normal}

.peek{align-self:flex-start;font-size:12px;color:var(--muted);text-decoration:underline;padding:0}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;display:flex;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.sheet-in{pointer-events:auto;position:relative;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 22%,transparent)}

.sel{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:52%}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.gcard:hover{border-color:var(--accent)}
.gcard b{font-size:16px}
.gzh{font-family:var(--hz);font-weight:700;font-size:22px;color:var(--accent)}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-height:56px;font-size:14px;line-height:1.25;transition:opacity .3s,background .2s}
.pt.hzp{font-family:var(--hz);font-size:24px;font-weight:700}

<script>
/* ---------- PLATFORM: Telegram, cloud sync, recorded audio ---------- */
const tg=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)?Telegram.WebApp:null;
if(tg){
  try{tg.ready();tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes()}catch(e){}
  const applyTheme=()=>{document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light';
    try{const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();tg.setHeaderColor(bg);tg.setBackgroundColor(bg);tg.setBottomBarColor&&tg.setBottomBarColor(bg)}catch(e){}};
  applyTheme();tg.onEvent('themeChanged',applyTheme);
}
const haptic=t=>{try{tg&&tg.HapticFeedback&&(t==='ok'?tg.HapticFeedback.notificationOccurred('success'):t==='bad'?tg.HapticFeedback.notificationOccurred('error'):tg.HapticFeedback.impactOccurred('light'))}catch(e){}};

// Progress lives in this browser and, inside Telegram, in Telegram's cloud storage,
// so it follows you between phone and computer.
const CS=tg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')?tg.CloudStorage:null;
const CHUNK=3800;
const Store={
  get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},
  stamp(k){try{return +localStorage.getItem(k+'@t')||0}catch(e){return 0}},
  set(k,v){const t=Date.now();try{localStorage.setItem(k,JSON.stringify(v));localStorage.setItem(k+'@t',String(t))}catch(e){}
    if(CS){Cloud.pending[k]={t,v};clearTimeout(Cloud.timer);Cloud.timer=setTimeout(Cloud.flush,1500)}}
};
const Cloud={pending:{},timer:0,
  flush(){
    for(const [k,{t,v}] of Object.entries(Cloud.pending)){
      const s=JSON.stringify({t,v}),n=Math.ceil(s.length/CHUNK);
      for(let i=0;i<n;i++)CS.setItem(k+'_'+i,s.slice(i*CHUNK,(i+1)*CHUNK),()=>{});
      CS.setItem(k+'_n',String(n),()=>{});
    }
    Cloud.pending={};
  },
  pull(keys,done){
    if(!CS)return done({});
    CS.getItems(keys.map(k=>k+'_n'),(err,ns)=>{
      if(err||!ns)return done({});
      const want=[];keys.forEach(k=>{const n=+ns[k+'_n']||0;for(let i=0;i<n;i++)want.push(k+'_'+i)});
      if(!want.length)return done({});
      CS.getItems(want,(e2,parts)=>{
        if(e2||!parts)return done({});
        const out={};
        keys.forEach(k=>{const n=+ns[k+'_n']||0;if(!n)return;let s='';for(let i=0;i<n;i++)s+=parts[k+'_'+i]||'';
          try{out[k]=JSON.parse(s)}catch(e){}});
        done(out);
      });
    });
  }
};

// recorded audio: file name = FNV-1a hash of the text
function fnv(s){let h=0x811c9dc5;for(const b of new TextEncoder().encode(s)){h^=b;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
let curA=null;
function playRecorded(text,onend){
  if(typeof AUDIO==='undefined'||!AUDIO.has(fnv(text)))return false;
  try{if(curA){curA.onended=null;curA.pause()}}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  const a=new Audio('audio/'+fnv(text)+'.mp3');curA=a;
  a.onended=()=>{if(curA===a)curA=null;onend&&onend()};
  a.play().catch(()=>{curA=null;speakTTS(text,onend)});
  return true;
}

let zhVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}catch(e){}}

let toastT=0;
function toast(msg){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},6000)}
let curU=null;   // keep a reference: some browsers drop an utterance that gets garbage-collected
function speakRaw(text,onend){if(playRecorded(text,onend))return;speakTTS(text,onend)}
function speakTTS(text,onend){
  const ss=window.speechSynthesis;
  if(!ss||!window.SpeechSynthesisUtterance){toast('Этот браузер не умеет озвучивать текст. Открой ссылку в Chrome или Safari.');return}
  if(!zhVoice)pickVoice();

      const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=.8;
      let started=false;u.onstart=()=>{started=true};

      u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')toast('Звук не запустился ('+e.error+').')};
      curU=u;
      if(ss.paused)ss.resume();
      ss.speak(u);
      setTimeout(()=>{if(!started&&!ss.speaking&&curU===u){
        toast(zhVoice?'Звук не запустился. Проверь громкость на компьютере и попробуй ещё раз.'
          :'На компьютере нет китайского голоса. Mac: Системные настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами → Китайский (материковый Китай).')}},1800);
    }catch(e){toast('Звук не запустился: '+e.message)}

}

/* ---------- spaced repetition ---------- */
// Test results become starting intervals, so known words go to the back right away.
function syncFromTest(){
  const now=Date.now();
  for(const [k,r] of Object.entries(S.results)){
    const c=C.cards[k];
    if(c&&c.src!=='test') continue;              // never override words already studied in cards
    if(c&&c.r===r) continue;
    if(r==='k')       C.cards[k]={src:'test',r,iv:Math.round(rnd(20,40)),ease:2.5,reps:1,lapses:0};
    else if(r==='lk') C.cards[k]={src:'test',r,iv:Math.round(rnd(7,21)),ease:2.5,reps:1,lapses:0};
    else if(r==='u')  C.cards[k]={src:'test',r,iv:Math.round(rnd(1,3)),ease:2.3,reps:1,lapses:0};
    else { delete C.cards[k]; continue }         // n / ln -> stays a new word
    C.cards[k].due=now+C.cards[k].iv*DAY;
  }
  saveC();
}
const isNew=i=>!C.cards[i];
const isLearned=i=>C.cards[i]&&C.cards[i].iv>=LEARNED_DAYS;
function status(i){
  const c=C.cards[i];
  if(!c) return S.results[i]===undefined?['todo','не проверено']:['n','новое'];
  if(c.iv>=LEARNED_DAYS) return ['k','выучено'];
  if(c.iv>=14) return ['k','хорошо'];
  if(c.iv>=1) return ['u','учу'];
  return ['n','учу'];
}
function plan(i,g){ // what an answer would do, without changing anything
  const c=C.cards[i]||{iv:0,ease:2.5,reps:0,lapses:0};
  const untested=!C.cards[i]&&S.results[i]===undefined;
  let iv,ease=c.ease;
  if(g===0){iv=0;ease=Math.max(1.3,ease-.2)}
  else if(g===1){iv=c.iv<1?1:Math.max(c.iv+1,Math.round(c.iv*1.2));ease=Math.max(1.3,ease-.15)}
  else{ if(untested&&c.reps===0) iv=21;      // first sight of an untested word and you know it: skip ahead
        else if(c.iv<1) iv=c.lapses?1:(c.reps?3:1);
        else iv=Math.max(c.iv+1,Math.round(c.iv*ease)) }
  return {iv,ease};
}
function rate(i,g){
  const c=C.cards[i]||{iv:0,ease:2.5,reps:0,lapses:0};
  const p=plan(i,g);
  if(isNew(i)){ if(C.newDay!==today()){C.newDay=today();C.newCount=0} C.newCount++ }
  c.src='cards';c.iv=p.iv;c.ease=p.ease;c.reps++;if(g===0)c.lapses++;
  c.due=Date.now()+(p.iv?p.iv*DAY:5*MIN);
  C.cards[i]=c;saveC();
}
function fmtIv(d){if(d<1)return 'снова сейчас';if(d===1)return 'завтра';if(d<30)return d+' дн.';if(d<365)return Math.round(d/30)+' мес.';return 'год+'}
function dueList(){const now=Date.now();return Object.entries(C.cards).filter(([,c])=>c.due<=now).sort((a,b)=>a[1].due-b[1].due).map(([k])=>+k)}
function newList(){
  // newest lessons first: what you just had with the teacher comes up before old material
  const left=C.newDay===today()?Math.max(0,NEW_PER_DAY-C.newCount):NEW_PER_DAY;
  const ids=WORDS.map((w,i)=>i).filter(isNew);
  ids.sort((a,b)=>WORDS[b][3]-WORDS[a][3]||a-b);
  return {left,ids};
}

function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}

let Q=null;
function startSession(due,news){
  // mix: one new word after every two reviews
  const q=[];let d=due.slice(),n=news.slice();
  while(d.length||n.length){if(d.length)q.push(d.shift());if(d.length)q.push(d.shift());if(n.length)q.push(n.shift())}

  const shown=h.slice(0,it.k)+'＿'+h.slice(it.k+1);
  const opts=shuffle(it.opts);
  G.onWrong=(a,b)=>{C.conf=C.conf||{};const key=[a,b].sort().join('');C.conf[key]=(C.conf[key]||0)+1;saveC()};
  mcRound({title,i:it.i,hz:true,opts,correct:opts.indexOf(it.c),
    body:`<div class="hz ${shown.length>3?'long':''}">${esc(shown)}</div><div class="py">${esc(w[1])}</div><div>${esc(w[2])}</div>${soundHint&&it.sound?`<span class="small muted">все варианты читаются как <b>${esc(it.sound)}</b></span>`:''}`,
    after:`<div class="hz mid" style="margin-top:6px">${esc(w[0])}</div>${spk(w[0])}
      <div class="cmeans">${opts.map(c=>`<div class="cm ${c===it.c?'ok':''}"><span class="cz">${esc(c)}</span><span class="cp">${esc(CHARPY[c]||'')}</span><span class="cr">${esc(charMeaning(c))}</span>${spk(c)}</div>`).join('')}</div>`});
}
function charMeaning(c){const w=WORDS.find(x=>x[0]===c);return CHARRU[c]||(w?w[2]:'')}
const HOMO_ITEMS=gapItems(HOMO), LOOK_ITEMS=gapItems(LOOKALIKE);
function homoNext(){G.next=homoNext;blankRound('Омофоны',HOMO_ITEMS,true)}
function lookNext(){G.next=lookNext;blankRound('Не перепутай',LOOK_ITEMS,false)}
/* Sprint */
function sprintInit(){G.end=Date.now()+60000;G.n=0;sprintNext();
  gTimer=setInterval(()=>{const left=Math.max(0,Math.ceil((G.end-Date.now())/1000));const c=$('#clock');if(c)c.textContent=left+' сек.';
    const p=$('.prog i');if(p)p.style.width=(100-left/60*100)+'%';
    if(left<=0){clearInterval(gTimer);gameOver(G.score,`${G.score} верных из ${G.n}`)}},250)}
function sprintNext(){
  cur='game';
  const pool=poolIds(),i=pool[Math.random()*pool.length|0];
  const truth=Math.random()<.5;
  let j=i;if(!truth){const alt=pool.filter(x=>x!==i&&WORDS[x][2]!==WORDS[i][2]);j=alt[Math.random()*alt.length|0]??i}
  app.innerHTML=`${gTop('Спринт · очки '+G.score,0)}
    <div class="card"><div class="hz ${clean(WORDS[i][0]).length>3?'long':''}">${esc(WORDS[i][0])}</div><div class="tr">${esc(WORDS[j][2])}</div><p class="small muted" id="clock">60 сек.</p></div>
    <div class="grades" style="grid-template-columns:1fr 1fr"><button class="grade g0" data-a="0">Неверно</button><button class="grade g2" data-a="1">Верно</button></div>`;
  bindQuit();
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
    const ok=(b.dataset.a==='1')===(i===j);G.n++;haptic(ok?'ok':'bad');
    if(ok)G.score++;else missed(i);
    const card=$('.card');card.classList.add(ok?'flash-ok':'flash-bad');
    setTimeout(()=>{if(cur==='game'&&G&&G.id==='sprint'&&Date.now()<G.end)sprintNext()},ok?250:700);
  });
}


/* ---------- WRITING (stroke order) ---------- */
const hasStrokes=c=>!!STROKES[c];
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
function makeWriter(el,ch,opts){
  if(!window.HanziWriter){el.innerHTML='<p class="small muted" style="padding:20px">Не удалось загрузить анимацию черт. Проверь интернет и обнови страницу.</p>';return null}
  const size=el.clientWidth||260;
  return HanziWriter.create(el,ch,Object.assign({
    width:size,height:size,padding:12,showOutline:true,
    strokeColor:cssVar('--ink'),outlineColor:cssVar('--line'),drawingColor:cssVar('--accent'),
    highlightColor:cssVar('--known'),radicalColor:cssVar('--accent'),
    strokeAnimationSpeed:1,delayBetweenStrokes:250,drawingWidth:22,
    charDataLoader:(c,done)=>done(STROKES[c])
  },opts||{}));
}
const GRID=`<svg class="grid" viewBox="0 0 100 100" aria-hidden="true"><rect x="1" y="1" width="98" height="98" fill="none" stroke="currentColor" stroke-width="1"/><path d="M50 1V99M1 50H99" stroke="currentColor" stroke-width=".6" stroke-dasharray="3 3"/><path d="M1 1L99 99M99 1L1 99" stroke="currentColor" stroke-width=".5" stroke-dasharray="2 3" opacity=".7"/></svg>`;
let WV=null;
function writeView(word,meta){ // overlay; works on top of cards, lessons, texts
  closeWrite();
  const chars=[...new Set([...clean(word)].filter(hasStrokes))];
  if(!chars.length){toast('Для этого слова нет данных о чертах.');return}
  const ov=document.createElement('div');ov.className='wov';ov.id='wov';
  document.body.appendChild(ov);document.body.classList.add('noscroll');
  WV={chars,k:0,writer:null,meta:meta||{}};
  renderWrite();
}
function closeWrite(){const o=$('#wov');if(o)o.remove();document.body.classList.remove('noscroll');WV=null}
function renderWrite(){
  const ov=$('#wov');if(!ov||!WV)return;
  const c=WV.chars[WV.k],m=WV.meta;
  ov.innerHTML=`<div class="wov-in">
    <div class="top"><div class="grow"><div class="eyebrow">Как писать${m.word&&m.word!==c?' · '+esc(m.word):''}</div></div><button class="btn plain" id="wx" style="width:auto;padding:8px">Закрыть</button></div>
    ${WV.chars.length>1?`<div class="wchars">${WV.chars.map((x,k)=>`<button class="${k===WV.k?'on':''}" data-k="${k}">${esc(x)}</button>`).join('')}</div>`:''}
    <div class="wbox">${GRID}<div id="wtarget" class="wtarget"></div></div>
    <div class="winfo"><span class="py">${esc(CHARPY[c]||m.py||'')}</span><button class="speak sm" id="wsay">${ICON}</button><span class="muted small">${STROKES[c].strokes.length} ${plural(STROKES[c].strokes.length,'черта','черты','черт')}</span></div>
    <p class="wmean">${esc(charMeaning(c)||m.ru||'')}</p>
    <div class="row"><button class="btn ghost" id="wplay">▶ Порядок черт</button><button class="btn" id="wquiz">✍ Пропиши сам</button></div>
    <p class="small muted" id="wmsg">Нажми «Порядок черт», чтобы посмотреть, или «Пропиши сам» и рисуй по клеткам пальцем или мышкой.</p>
    <p class="small muted" style="opacity:.7">Анимация: Hanzi Writer, данные о чертах: Make Me a Hanzi (Arphic Public License).</p>
  </div>`;
  $('#wx').onclick=closeWrite;
  $('#wsay').onclick=()=>say(c);
  ov.querySelectorAll('.wchars button').forEach(b=>b.onclick=()=>{WV.k=+b.dataset.k;renderWrite()});
  const t=$('#wtarget');
  requestAnimationFrame(()=>{
    WV.writer=makeWriter(t,c);
    if(!WV.writer)return;
    $('#wplay').onclick=()=>{WV.writer.cancelQuiz();WV.writer.showCharacter();WV.writer.hideCharacter({duration:0});WV.writer.animateCharacter();$('#wmsg').textContent='Смотри порядок: черты рисуются по одной.'};
    $('#wquiz').onclick=()=>{
      $('#wmsg').textContent='Рисуй черты по порядку. После трёх ошибок появится подсказка.';
      WV.writer.quiz({showHintAfterMisses:3,highlightOnComplete:true,
        onMistake:()=>{},
        onComplete:s=>{const n=s.totalMistakes;$('#wmsg').innerHTML=n===0?'<b style="color:var(--known)">Отлично, без ошибок!</b>':`Готово. Ошибок: ${n}. Попробуй ещё раз.`;
          if(WV.k<WV.chars.length-1)$('#wmsg').innerHTML+=` <button class="peek" id="wnext">Следующий иероглиф →</button>`;
          $('#wnext')?.addEventListener('click',()=>{WV.k++;renderWrite()})}});
    };
  });
}
/* writing game */
function writeNext(){
  cur='game';G.next=writeNext;
  const pool=poolIds().filter(i=>[...clean(WORDS[i][0])].some(hasStrokes));
  const i=pool[Math.random()*pool.length|0],w=WORDS[i],h=clean(w[0]);
  const ks=[...h].map((c,k)=>k).filter(k=>hasStrokes(h[k]));
  const k=ks[Math.random()*ks.length|0],c=h[k];
  const shown=h.length>1?h.slice(0,k)+'＿'+h.slice(k+1):'＿';
  app.innerHTML=`${gTop(`Пропиши · ${G.round+1} из 10 · очки ${G.score}`,G.round/10)}
    <div class="card" style="min-height:0;padding:18px 16px">
      <div class="hz long">${esc(shown)}</div><div class="py">${esc(w[1])}</div><div>${esc(w[2])}</div>
    </div>
    <div class="wbox">${GRID}<div id="wtarget" class="wtarget"></div></div>
    <p class="small muted" id="wmsg" style="text-align:center">Напиши пропущенный иероглиф. После трёх ошибок в черте появится подсказка.</p>
    <div class="row"><button class="btn ghost" id="whint">Показать контур</button><button class="btn plain" id="wskip">Не помню</button></div>
    <div id="nx"></div>`;
  bindQuit();
  requestAnimationFrame(()=>{
    const wr=makeWriter($('#wtarget'),c,{showOutline:false,showCharacter:false});
    if(!wr)return;
    let hinted=false;
    const finish=(ok,txt)=>{
      $('#wmsg').innerHTML=txt;$('#whint').parentElement.hidden=true;
      if(ok)G.score++;else missed(i);
      $('#nx').innerHTML=`<div class="row"><button class="speak" id="ws">${ICON} ${esc(w[0])}</button></div><button class="btn" id="nxt" style="margin-top:8px">${G.round>=9?'Итог':'Дальше'}</button>`;
      $('#ws').onclick=()=>say(w[0]);
      $('#nxt').onclick=()=>{G.round++;if(G.round>=10)return gameOver(G.score,`${G.score} из 10`);writeNext()};
    };
    wr.quiz({showHintAfterMisses:3,highlightOnComplete:true,
      onComplete:s=>{const ok=s.totalMistakes<=2&&!hinted;finish(ok,ok?`<b style="color:var(--known)">Верно!</b> Ошибок: ${s.totalMistakes}.`:`Готово, но с подсказками (ошибок: ${s.totalMistakes}). Это слово ещё повторим.`)}});
    $('#whint').onclick=()=>{hinted=true;wr.showOutline()};
    $('#wskip').onclick=()=>{wr.cancelQuiz();wr.showCharacter();wr.hideCharacter({duration:0});wr.animateCharacter();finish(false,'Смотри, как он пишется.')};
  });
}


/* ---------- TEST ---------- */
function lessonCounts(n){
  const c={k:0,u:0,n:0,todo:0};
  for(const i of lessonWords(n)){const r=S.results[i];
    if(r==='k'||r==='lk')c.k++;else if(r==='u')c.u++;else if(r==='n'||r==='ln')c.n++;else c.todo++}
  return c;
}
function testHome(){
  cur='testHome';showTabs(true);
  const doneN=Object.keys(S.done).length;
  const next=LESSONS.find(([n])=>!S.done[n]);
  const rows=LESSONS.map(([n,t])=>{const ws=lessonWords(n),c=lessonCounts(n);
    const pill=S.done[n]?`<span class="pill">${Math.round(c.k/ws.length*100)}%</span>`:`<span class="pill todo">${ws.length} сл.</span>`;
    return `<button class="lrow" data-l="${n}"><span class="lnum">${n}</span><span class="lname"><b>${esc(t)}</b>${S.done[n]?bar(c,ws.length):''}</span>${pill}</button>`}).join('');
  app.innerHTML=`
    <div><div class="eyebrow">Вводный тест · ${doneN} из ${LESSONS.length} уроков</div><h1 style="margin-top:6px">Что ты уже знаешь</h1></div>
    <p class="muted">Видишь иероглиф и выбираешь перевод. Если не помнишь, жми «Не знаю». Урок занимает 1–3 минуты. Все уроки проходить не обязательно: непроверенные слова приложение проверит само, когда они придут в карточках.</p>
    ${next?`<button class="btn" id="go">${doneN?'Продолжить':'Начать'}: урок ${next[0]}</button>`:''}
    ${doneN?`<button class="btn ghost" id="res">Итог теста</button>`:''}
    <div class="panel"><div class="lessons">${rows}</div></div>
    <label class="toggle panel" for="aud"><span>Задания на слух<br><span class="small muted">${canSpeak()?'Иногда вместо иероглифа будет звук':'На этом устройстве нет китайского голоса, задания на слух выключены'}</span></span><input type="checkbox" id="aud" ${S.audio&&canSpeak()?'checked':''} ${canSpeak()?'':'disabled'}></label>
    ${doneN?`<button class="btn plain" id="reset">Сбросить результаты теста</button>`:''}`;
  $('#go')?.addEventListener('click',()=>startLesson(next[0]));
  $('#res')?.addEventListener('click',results);
  $('#aud').addEventListener('change',e=>{S.audio=e.target.checked;saveS()});
  $('#reset')?.addEventListener('click',confirmReset);
  app.querySelectorAll('.lrow').forEach(b=>b.addEventListener('click',()=>startLesson(+b.dataset.l)));
}
function confirmReset(){
  const b=$('#reset');b.outerHTML=`<div class="row"><button class="btn ghost" id="no">Отмена</button><button class="btn" id="yes" style="background:var(--new)">Сбросить</button></div>`;
  $('#no').onclick=testHome;
  $('#yes').onclick=()=>{for(const k of Object.keys(C.cards)) if(C.cards[k].src==='test') delete C.cards[k];saveC();
    S={results:{},done:{},audio:S.audio};saveS();testHome()};
}
let L=null;
function startLesson(n){
  const ids=shuffle(lessonWords(n));
  L={n,queue:ids.slice(0,MAX_Q),rest:ids.slice(MAX_Q),pos:0,streak:0,asked:[],t0:0};
  for(const i of ids) delete S.results[i];
  showTabs(false);ask();
}
function distractors(i,field,k){
  const w=WORDS[i];const same=shuffle(WORDS.map((x,j)=>j).filter(j=>j!==i&&WORDS[j][3]===w[3]));
  const other=shuffle(WORDS.map((x,j)=>j).filter(j=>j!==i&&WORDS[j][3]!==w[3]));
  const out=[],seen=new Set([w[field]]);
  for(const j of same.concat(other)){const v=WORDS[j][field];if(!seen.has(v)){seen.add(v);out.push(j)}if(out.length===k)break}
  return out;
}
function ask(){
  cur='ask';
  if(L.pos>=L.queue.length) return finishLesson();
  const i=L.queue[L.pos],w=WORDS[i];
  const audio=S.audio&&canSpeak()&&L.pos%4===3;
  const opts=shuffle([i,...distractors(i,audio?0:2,3)]);
  app.innerHTML=`
    <div class="top"><div class="grow"><div class="eyebrow">Тест · урок ${L.n} · ${esc(LESSONS[L.n-1][1])}</div><div class="prog"><i style="width:${L.pos/L.queue.length*100}%"></i></div></div><button class="btn plain" id="quit" style="width:auto;padding:8px">Выйти</button></div>
    <div class="card">
      ${audio?`<p class="muted small">Какой это иероглиф?</p><button class="speak big" id="play">${ICON} Слушать</button>`:`<div class="hz ${clean(w[0]).length>3?'long':''}">${esc(w[0])}</div>`}
      <div id="rev"></div>
    </div>
    <div class="opts ${audio?'grid2':''}">${opts.map(j=>`<button class="opt ${audio?'hzopt':''}" data-j="${j}">${esc(audio?WORDS[j][0]:WORDS[j][2])}</button>`).join('')}</div>
    <button class="btn plain" id="idk">Не знаю</button>`;
  $('#quit').onclick=()=>{saveS();setTab('test')};
  if(audio){$('#play').onclick=()=>say(w[0]);say(w[0])}
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(i,+b.dataset.j,audio));
  $('#idk').onclick=()=>answer(i,-1,audio);
  L.t0=performance.now();
}
function answer(i,j,audio){
  const ms=performance.now()-L.t0,w=WORDS[i],ok=j===i;
  const r=ok?(ms<FAST_MS?'k':'u'):'n';
  S.results[i]=r;L.asked.push(i);
  L.streak=r==='k'?L.streak+1:-99;
  app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const x=+b.dataset.j;if(x===i)b.classList.add('right');else if(x===j)b.classList.add('wrong')});
  $('#rev').innerHTML=`${audio?`<div class="hz mid">${esc(w[0])}</div>`:''}<div class="py">${esc(w[1])}</div><div>${esc(w[2])}</div><button class="speak sm" id="say2" style="margin-top:8px">${ICON} слушать</button>`;
  $('#say2').onclick=()=>say(w[0]);
  const idk=$('#idk');idk.textContent='Дальше';idk.className='btn';idk.onclick=nextQ;
  if(ok) setTimeout(()=>{if(cur==='ask'&&L.asked[L.asked.length-1]===i&&L.pos===L.asked.length-1)nextQ()},1400);
}
function nextQ(){
  L.pos++;
  if(L.streak>=EARLY_STOP&&L.pos>=EARLY_STOP){L.rest=L.queue.slice(L.pos).concat(L.rest);L.queue=L.queue.slice(0,L.pos);L.early=true}
  ask();
}
function finishLesson(){
  cur='done';showTabs(true);
  const asked=L.asked,known=asked.filter(i=>S.results[i]==='k'||S.results[i]==='u').length;
  const acc=asked.length?known/asked.length:0;
  for(const i of L.rest) S.results[i]=acc>=.8?'lk':'ln';
  S.done[L.n]=true;saveS();syncFromTest();
  const ws=lessonWords(L.n),c=lessonCounts(L.n);
  const nextL=LESSONS.find(([n])=>!S.done[n]);
  const weak=ws.filter(i=>S.results[i]==='n'||S.results[i]==='u');
  app.innerHTML=`
    <div><div class="eyebrow">Урок ${L.n} проверен</div><h1 style="margin-top:6px">${esc(LESSONS[L.n-1][1])}</h1></div>
    <div class="stats"><div class="stat k"><b>${c.k}</b><span>знаю</span></div><div class="stat u"><b>${c.u}</b><span>неуверенно</span></div><div class="stat n"><b>${c.n}</b><span>учить</span></div></div>
    ${L.rest.length?`<p class="note">${L.early?`Первые ${EARLY_STOP} слов ты знаешь уверенно, поэтому`:'Проверила '+asked.length+' слов из '+ws.length+', и'} ${acc>=.8?`ещё ${L.rest.length} сл. урока я отметила как «скорее знаю». Они придут в карточках через 1–3 недели для проверки.`:`оставшиеся ${L.rest.length} сл. пойдут в карточки как новые.`}</p>`:''}
    ${weak.length?`<div class="panel"><h2 style="margin-bottom:10px">Пойдут в карточки</h2><div class="chips">${weak.map(i=>`<button class="chip ${S.results[i]==='u'?'u':''}" data-i="${i}" title="${esc(WORDS[i][1]+' — '+WORDS[i][2])}">${esc(WORDS[i][0])}</button>`).join('')}</div><p class="small muted" style="margin-top:10px">Нажми на слово, чтобы услышать его.</p></div>`:''}
    ${nextL?`<button class="btn" id="nx">Урок ${nextL[0]}: ${esc(nextL[1])}</button>`:''}
    <button class="btn ghost" id="learn">Перейти к карточкам</button>`;
  $('#nx')?.addEventListener('click',()=>startLesson(nextL[0]));
  $('#learn').onclick=()=>setTab('learn');
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>say(WORDS[+b.dataset.i][0]));
}
function results(){
  cur='results';
  let k=0,u=0,n=0;
  for(const r of Object.values(S.results)){if(r==='k'||r==='lk')k++;else if(r==='u')u++;else n++}
  const doneL=LESSONS.filter(([x])=>S.done[x]);
  const rows=doneL.map(([x,t])=>{const ws=lessonWords(x),c=lessonCounts(x);return `<button class="lrow" data-l="${x}"><span class="lnum">${x}</span><span class="lname"><b>${esc(t)}</b>${bar(c,ws.length)}</span><span class="pill">${Math.round(c.k/ws.length*100)}%</span></button>`}).join('');
  const weakest=doneL.map(([x,t])=>[x,t,lessonCounts(x).k/lessonWords(x).length]).sort((a,b)=>a[2]-b[2]).slice(0,3).filter(a=>a[2]<.8);
  app.innerHTML=`
    <div class="top"><button class="btn plain" id="back" style="width:auto;padding:8px 8px 8px 0">← Тест</button></div>
    <div><div class="eyebrow">Итог · ${doneL.length} из ${LESSONS.length} уроков</div><h1 style="margin-top:6px">Твоя карта слов</h1></div>
    <div class="stats"><div class="stat k"><b>${k}</b><span>знаю</span></div><div class="stat u"><b>${u}</b><span>неуверенно</span></div><div class="stat n"><b>${n}</b><span>учить</span></div></div>
    ${weakest.length?`<p class="note">Больше всего пробелов: ${weakest.map(a=>`урок ${a[0]} (${esc(a[1])})`).join(', ')}.</p>`:''}
    <div class="panel"><div class="lessons">${rows}</div></div>`;
  $('#back').onclick=testHome;
  app.querySelectorAll('.lrow').forEach(b=>b.addEventListener('click',()=>startLesson(+b.dataset.l)));
}

setTab('learn');
</script>
</body>
